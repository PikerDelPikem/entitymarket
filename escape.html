<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>There's No Escape</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="fnaf-container">
      <div class="wrapper-misterio">
        <img
          id="misterio-escape"
          src="images/Gameover.png"
          alt="Cenário Inicial"
          onclick="
            interagirMisterio();
            tocarSomGameOver();
          "
        />

        <div
          id="item-jornal-final"
          onclick="
            apanharJornalFinal();
            tocarSomMenu();
          "
        >
          📰 RECORTE FINAL<br />
          "O COLAPSO DO PERÍMETRO"
          <span>[Clique para recolher arquivo]</span>
        </div>
      </div>
    </div>

    <audio id="som-gameover" src="audio/cam_click.mp3" preload="auto"></audio>

    <audio id="som-clique" src="audio/collected.mp3" preload="auto"></audio>

    <script>
      // Função para tocar som do Game Over
      function tocarSomGameOver() {
        let som = document.getElementById("som-gameover");
        if (som) {
          som.currentTime = 0;
          som.volume = 0.3;
          som
            .play()
            .catch((erro) =>
              console.log("Erro ao tocar som do Game Over:", erro),
            );
        }
      }

      // Função para tocar som do RECORTE FINAL
      function tocarSomMenu() {
        let som = document.getElementById("som-clique");
        if (som) {
          som.currentTime = 0;
          som.volume = 0.3;
          som
            .play()
            .catch((erro) => console.log("Erro ao tocar som do menu:", erro));
        }
      }
    </script>
    <script src="js/script.js"></script>
    <script src="js/menu-audio.js"></script>
  </body>
</html>
